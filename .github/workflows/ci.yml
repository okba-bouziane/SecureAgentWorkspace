name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: saw
          POSTGRES_PASSWORD: saw
          POSTGRES_DB: saw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saw -d saw_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://saw:saw@localhost:5432/saw_test
      TEST_REDIS_URL: redis://localhost:6379/1
      HF_CACHE_DIR: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-model-Xenova-all-MiniLM-L6-v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Evals (retrieval recall, tool routing, injection, PII) with thresholds
        run: npm run evals
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests (kubectl dry-run, no cluster)
        run: node k8s/dry-run.mjs

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
