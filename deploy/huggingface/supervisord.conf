[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:postgres]
command=postgres -D /data/pg
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --dir /data/redis --save "" --appendonly no
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:keycloak]
command=/opt/keycloak/bin/kc.sh start-dev --import-realm --http-port=8080 --http-relative-path=/auth --hostname=%(ENV_PUBLIC_URL)s/auth --hostname-backchannel-dynamic=true --proxy-headers=xforwarded --http-enabled=true
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:securemcp]
command=node dist/index.js
directory=/app/mcp
environment=PORT="3000",DB_PATH="/data/securemcp.db",KEYCLOAK_ISSUER="%(ENV_OIDC_ISSUER)s",KEYCLOAK_JWKS_URL="%(ENV_OIDC_JWKS_URL)s",KEYCLOAK_AUDIENCE="mcp-server"
priority=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/app/wait-run.sh node dist/main.js
directory=/app/api
environment=PORT="3001",SEED_ON_START="true"
priority=4
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=/app/wait-run.sh node dist/worker.js
directory=/app/api
environment=PORT="3001",SEED_ON_START="false",WORKER_METRICS_PORT="9101"
priority=4
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /app/nginx.conf -g "daemon off;"
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
