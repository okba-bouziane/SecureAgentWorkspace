# Secure Agent Workspace: full local stack.
# Host ports: web 5173, api 3001, keycloak 8081, securemcp 3102, postgres 5433, redis 6380.
name: secure-agent-workspace

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: saw
      POSTGRES_PASSWORD: saw
      POSTGRES_DB: saw
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saw -d saw"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: kcadmin
      # Tokens always carry iss=http://localhost:8081/..., from the host and from inside the network.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The existing SecureMCP project, built from the sibling folder (git clone it next to this repo).
  securemcp:
    build: ${SECUREMCP_PATH:-../SecureMCP}
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_PATH: /app/data/securemcp.db
      KEYCLOAK_ISSUER: http://localhost:8081/realms/securemcp
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/securemcp/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: mcp-server
    ports:
      - "3102:3000"
    volumes:
      - mcp-data:/app/data

  api:
    build: ./api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      securemcp: { condition: service_started }
    environment: &api-env
      PORT: 3001
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://saw:saw@postgres:5432/saw
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER: http://localhost:8081/realms/securemcp
      OIDC_JWKS_URL: http://keycloak:8080/realms/securemcp/protocol/openid-connect/certs
      OIDC_AUDIENCE: mcp-server
      MCP_URL: http://securemcp:3000/mcp
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      GUARD_MODEL: ${GUARD_MODEL:-}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-20}
      SEED_ON_START: "true"
      SEED_DIR: /app/seed
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    build: ./api
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *api-env
      SEED_ON_START: "false"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:3001
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/securemcp
        VITE_OIDC_CLIENT_ID: saw-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pg-data:
  redis-data:
  mcp-data:
