apiVersion: apps/v1
kind: Deployment
metadata:
  name: saw-api
  labels: { app: saw-api, app.kubernetes.io/part-of: secure-agent-workspace }
spec:
  replicas: 2
  selector:
    matchLabels: { app: saw-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: saw-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      # Longer than the API's own 15 s drain timeout so in-flight chat streams can finish.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: saw-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - configMapRef: { name: saw-config }
            - secretRef: { name: saw-secrets }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: saw-api
  labels: { app: saw-api }
spec:
  selector: { app: saw-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: saw-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: saw-api }
