apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saw-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: saw-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saw-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: saw-worker }
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
